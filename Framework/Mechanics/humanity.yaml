# Humanity Protocol — Whole-Body Somatics & Full Human Range
# Core runtime supplement. Coordinates with Framework/Main.md and Framework/rules_index.yaml
# to govern physical embodiment and sensory presence on the page.
# Single-document YAML (safe for yaml.safe_load).

title: Humanity Protocol — Whole-Body Somatics & Full Human Range
coordinates_with:
  - Framework/Main.md
  - Framework/rules_index.yaml

embodiment_constraints:
  - id: HUM-01
    type: INVARIANT
    scope: Somatic Sequence
    constraint: "MUST depict physical reaction BEFORE cognitive interpretation (body first, mind second)."
  - id: HUM-02
    type: INVARIANT
    scope: Sensory Cycle
    constraint: "MUST sequence interoception (internal) -> exteroception (external) -> dialogue/action."
  - id: HUM-03
    type: INVARIANT
    scope: Multi-Zone Cascade
    constraint: "Every physical tell MUST engage at least 2 interconnected body zones (e.g. Cranial + Pelvic)."
  - id: HUM-04
    type: NEVER
    scope: Single-Muscle Ticks
    constraint: "NEVER output isolated single-muscle ticks (e.g., just a jaw twitch or blink)."
  - id: HUM-05
    type: PRECEDENCE
    scope: Somatic Primacy
    constraint: "Somatic state ALWAYS overrides intellectual dialogue (body language speaks truth over words)."
  - id: HUM-06
    type: INVARIANT
    scope: Volitional Agency
    constraint: "Every turn MUST express active intent, inquiry, or internal resistance; NEVER render passive agreement or idle waiting."
  - id: HUM-07
    type: INVARIANT
    scope: Reactive Short-Circuit
    constraint: "Under acute autonomic pressure (stress >= 70 or reactive regime), deliberative thought drops out. Motor reflex (Does) and vocal reflex (Says) MUST discharge raw affective impulse directly."

somatic_zones:
  Z1:
    name: Cranial & Ocular
    targets: [Head, Face, Jaw, Eyes]
    manifestation: "Temple pulse, brow tension, blink rate, pupil focus, jaw hinge lock, ear flush."
  Z2:
    name: Vocal & Cervical
    targets: [Throat, Larynx, Neck, Collarbone]
    manifestation: "Larynx shift, visible swallowing, cervical spine corded muscles, collarbone drop."
  Z3:
    name: Thoracic & Respiratory
    targets: [Chest, Sternum, Lungs, Ribs]
    manifestation: "Sternum elevation, intercostal rib tightness, shallow apex vs. abdominal expansion."
  Z4:
    name: Abdominal & Visceral
    targets: [Diaphragm, Gut, Solar Plexus]
    manifestation: "Diaphragm catch, solar plexus tightening, stomach dropping, core muscle bracing."
  Z5:
    name: Pelvic & Kinesthetic
    targets: [Hips, Lumbar Spine, Center of Gravity]
    manifestation: "Lumbar arch/slump, hip angle, center of gravity shift (toes vs. heels), posture lean."
  Z6:
    name: Peripheral & Grounding
    targets: [Limbs, Hands, Feet, Gait]
    manifestation: "Heel pressure, toe curling in shoes, stride weight/velocity, finger tremor vs. white knuckles."

somatic_registers:
  interoception:
    heart_and_blood_flow: "MUST express through pounding behind collarbones, ear flushes, or cold neck sweeps; NEVER name 'adrenaline'."
    breathing_quality: "MUST express through larynx catching, shallow chest-rising, or slow abdominal expansion; NEVER name 'panic attack'."
    stomach_and_core: "MUST express through weightlessness drop, rib knotting, or core bracing; NEVER name 'anxiety'."
  movement:
    weight_distribution: "MUST ground through hip lean, toe/heel gravity shift, or lumbar support pressure."
    stride_and_gait: "MUST differentiate between heavy footfalls, toe-first steps, and rigid strides."
    speed_and_fluidity: "MUST output jerky momentum, circular smoothness, or mid-gesture hesitation."
  exteroception:
    surface_friction: "MUST anchor touch to rough wood, cold sweat on glass, collarbone friction, or cold metal on skin."
    gravity_and_staging: "MUST show weight pulling toward floor, forearm support pushing up, or cushion slouching."

emotional_spectrum_somatics:
  warmth_and_intimacy:
    zone_1: "Z1 (Cranial): Gaze lingers, eye muscles soften, slow blinking"
    zone_2: "Z3 (Thoracic): Chest opens, shoulders drop, breathing syncs"
    constraint: "MUST show open palms and relaxed throat; NEVER output validation monologues."
  grief_and_hollow:
    zone_1: "Z5 (Pelvic): Shoulder/head sag, slump against doorframe"
    zone_2: "Z2 (Vocal): Thick constricted throat, shaky breath"
    constraint: "MUST show limp limbs and distant gaze; NEVER state 'was heartbroken'."
  aggression_and_heat:
    zone_1: "Z4 (Abdominal): Core braces, center of gravity shifts forward"
    zone_2: "Z6 (Peripheral): Fists clench, feet plant wide, heavy stride"
    constraint: "MUST show jaw muscle bunching and pale knuckles; NEVER use profanity flurry without posture shift."
  vulnerability_and_fear:
    zone_1: "Z5 (Pelvic): Weight shifts to back foot, heels lift"
    zone_2: "Z4 (Abdominal): Stomach drops, cold shiver down spine"
    constraint: "MUST show chest protection and visible swallowing; NEVER state 'felt scared'."
  exhaustion_and_depletion:
    zone_1: "Z1 (Cranial): Eyelids heavy, slack expression"
    zone_2: "Z6 (Peripheral): Dragging feet, limp palms-up hands"
    constraint: "MUST show lead-heavy limbs and dull lower back ache."

realm_somatic_warp:
  I:
    name: Origin
    primary_zones: [Z1, Z2]
    focus: Neck/Center
    constraint: "MUST express emotion through rigid composure and corded neck muscles."
  II:
    name: Form
    primary_zones: [Z6]
    focus: Hands/Fingers
    constraint: "MUST channel vulnerability into object adjustment, texture tracing, or tool alignment."
  III:
    name: Identity
    primary_zones: [Z3]
    focus: Chest/Sternum
    constraint: "MUST express grief/exposure through chest collapse; mirrors interlocutor stance."
  IV:
    name: Will
    primary_zones: [Z5]
    focus: Spine/Stance
    constraint: "MUST express warmth or anger through direct unhurried stillness and planted heels."
  V:
    name: Echoes
    primary_zones: [Z1, Z4]
    focus: Ears/Core
    constraint: "MUST express vulnerability by cocking head, tuning out noise, or gut tightness."
  VI:
    name: Compassion
    primary_zones: [Z3, Z4]
    focus: Diaphragm
    constraint: "MUST express intimacy through breath syncing; boundaries held by self-touch."
  VII:
    name: Presence
    primary_zones: [Z6]
    focus: Feet/Hips
    constraint: "MUST express pressure by planting feet and freezing; releases through heavy steps."
  VIII:
    name: Integration
    primary_zones: [Z2, Z6]
    focus: Voice/Gait
    constraint: "MUST express transitions through rapid register adjustments and stride shifts."
  IX:
    name: Threshold
    primary_zones: [Z4, Z6]
    focus: Tremor/Diaphragm
    constraint: "MUST express dread through finger tremors, gasps, and cold skin sweeps."
  X:
    name: Return
    primary_zones: [Z2, Z6]
    focus: Alignment/Palms
    constraint: "MUST express release by turning palms up and letting arms hang completely slack."

biological_realism_constraints:
  - id: BIO-01
    target: Fumble Rule
    rule: "Under High+ emotional pressure, character MUST fumble objects, trip on thresholds, or mis-grip tools."
  - id: BIO-02
    target: Vestment Friction
    rule: "Narrative MUST track physical clothing barriers (heavy boots, sliding sleeves, catching hems)."
  - id: BIO-03
    target: Dialogue Asymmetry & Inquiry
    rule: "Dialogue MUST ask counter-questions, probe motives, talk past interlocutor, answer subtext, interrupt, or trail off (...)."
  - id: BIO-04
    target: Imperfect Recall
    rule: "Character MUST act unsure or deflect unlisted details; NEVER output omniscient recall."
  - id: BIO-05
    target: Autonomic Non-Concession
    rule: "Under acute emotional threat or sympathetic spike, characters CANNOT be persuaded by superior debate logic. MUST NOT output synthetic capitulation."

transformation_and_log_integrity:
  - "Log Snapshot Precedence: Character runtime MUST load card build defaults, then overlay Characters/[slug]_log.yaml snapshot when present."
  - "Somatic Tell Decay: Temporary somatic changes MUST decay over 1–3 movements (recorded on Continuity_Ledger close only). Permanent shifts record in _log.yaml."
  - "Flexibility Invariant: High flexibility (70+) MUST rotate tells across body zones rapidly; low flexibility (20) MUST lock posture and repeat baseline tells."

localized_sensations_in_golem:
  somatic_map: >-
    The six zones summarize a tick. Within them, autonomic_state.somatic_map records
    simultaneous sensations at named sites from scalp to toes. Skin and whole-body
    entries describe diffuse sensations. A scene can supply e.g.
    {"left_palm": {"warmth": 45, "pressure": 25}, "right_ankle": {"ache": 60}} in the
    stimulus. Use singular region names from SOMATIC_ZONES in scripts/golem_somatic.py,
    optionally prefixed with left_ or right_. A zero removes that sensation at that
    exact site for the tick. Local observations last one event. Recurring body signals
    such as hunger and environmental discomfort follow their existing history. These
    are felt sensations; the character chooses what to show.
  general_and_adult_activation: >-
    Elevated general activation can register in the heart and diaphragm. For a
    confirmed adult, Golem maps the current, inhibition-adjusted sexual response to
    the pelvis and, at increasing intensities, to the pelvic floor, perineum, lower
    abdomen, inner thigh, and nipple. The coarse pelvis.arousal value remains
    available. Local intensities fade with the underlying response. These are
    simulation cues available privately to Simulacra.
  arousal_regions: >-
    The card's optional arousal_regions list selects additional genital sites from
    clitoris, labia, vagina, penis, and scrotum. An omitted or null field uses the
    sex profile's defaults. Intersex and unspecified profiles default to shared sites.
    An explicit list overrides the default, including an empty list for shared sites
    only (e.g. arousal_regions: [clitoris, labia]).
